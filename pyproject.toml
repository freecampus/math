[project]
name = "freecampus-math"
version = "0.5.0"  # semantic-release
description = "Proof-aware mathematics curriculum tools for exact, numerical, and interactive learning."
readme = "README.md"
requires-python = ">=3.10,<4"
license = "BSD-3-Clause"
authors = [
  { name = "FreeCampus contributors" }
]
keywords = [
  "education",
  "mathematics",
  "python",
  "symbolic-computation",
  "open-education",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "sympy>=1.12,<2",
]

[project.urls]
Homepage = "https://freecampus.github.io/math/"
Repository = "https://github.com/freecampus/math"
Issues = "https://github.com/freecampus/math/issues"
Documentation = "https://freecampus.github.io/math/"

[project.optional-dependencies]
notebook = [
  "ipython>=8.18,<10",
  "ipywidgets>=8.1,<9",
]
dev = [
  "ipython>=8.18,<10",
  "ipywidgets>=8.1,<9",
  "jupyter>=1.1,<2",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.10,<3",
  "pre-commit>=3.7,<5",
  "PyYAML>=6,<7",
  "makim==1.29.0",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
ruff = ">=0.9,<1"
mypy = ">=1.10,<3"
pre-commit = ">=3.7,<5"
makim = "==1.29.0"
click = ">=8.1,<9"
ipython = ">=8.18,<10"
ipywidgets = ">=8.1,<9"
jupyter = ">=1.1,<2"
nbclient = ">=0.10,<1"
nbconvert = ">=7.16,<8"
pyyaml = ">=6,<7"

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
  { include = "fcmath", from = "src" },
]
include = [
  "src/fcmath/py.typed",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "RUF",
]
ignore = [
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["E402"]
"src/fcmath/__init__.py" = ["F401"]
"src/fcmath/validation/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "IPython.*",
  "ipywidgets.*",
  "sympy.*",
  "yaml.*",
]
ignore_missing_imports = true
