groups:
  all:
    tasks:
      ci:
        help: Run structural, package, notebook, and documentation gates
        hooks:
          pre-run:
            - task: curriculum.validate
            - task: curriculum.check-generated
            - task: notebooks.check
            - task: tests.linter
            - task: tests.unit
            - task: package.build
            - task: docs.build

  curriculum:
    tasks:
      validate:
        help: Validate catalog structure and every quiz bank
        run: python scripts/validate_curriculum.py

      generate:
        help: Generate navigation and curriculum manifests
        run: python scripts/generate_navigation.py

      check-generated:
        help: Fail when catalog-derived files are stale
        run: python scripts/generate_navigation.py --check

  notebooks:
    tasks:
      build:
        help: Build all Colab/Jupyter notebooks from canonical QMD lessons
        run: python scripts/build_notebooks.py

      check:
        help: Verify generated notebooks match their QMD sources
        run: python scripts/build_notebooks.py --check

      execute-representative:
        help: Execute one representative generated notebook per course
        run: python scripts/execute_notebooks.py

      execute-all:
        help: Execute every generated notebook
        run: python scripts/execute_notebooks.py --all

  clean:
    tasks:
      tmp:
        help: Clean generated build and temporary files
        backend: bash
        run: |
          rm -fr build/ dist/ .eggs/ htmlcov/ .pytest_cache/ .mypy_cache/ .ruff_cache/
          rm -fr .quarto-tmp .cache docs/.quarto docs/_freeze
          rm -f .coverage
          find . -name '*.egg-info' -exec rm -fr {} +
          find . -name '*.egg' -exec rm -f {} +
          find . -name '*.pyc' -exec rm -f {} +
          find . -name '__pycache__' -exec rm -fr {} +
          find . -name '*.pyo' -exec rm -f {} +
          find . -name '*~' -exec rm -f {} +

  docs:
    tasks:
      build:
        help: Validate and build the Quarto documentation website once
        backend: bash
        hooks:
          pre-run:
            - task: curriculum.validate
            - task: curriculum.check-generated
        run: |
          rm -fr build
          mkdir -p .quarto-tmp .cache/deno
          TMPDIR="$PWD/.quarto-tmp" \
            XDG_CACHE_HOME="$PWD/.cache" \
            DENO_DIR="$PWD/.cache/deno" \
            quarto render docs --no-execute-daemon
          python scripts/check_rendered_site.py build

      render:
        help: Alias for docs.build
        hooks:
          pre-run:
            - task: docs.build

      preview:
        help: Preview the Quarto site locally
        backend: bash
        hooks:
          pre-run:
            - task: curriculum.validate
            - task: curriculum.check-generated
        run: |
          mkdir -p .quarto-tmp .cache/deno
          TMPDIR="$PWD/.quarto-tmp" \
            XDG_CACHE_HOME="$PWD/.cache" \
            DENO_DIR="$PWD/.cache/deno" \
            quarto preview docs

  tests:
    tasks:
      linter:
        help: Run formatting, lint, typing, and repository hooks
        run: pre-commit run --all-files --verbose

      unit:
        help: Run tests
        args:
          path:
            help: Specify the test location
            type: string
            default: ""
          params:
            help: Additional pytest parameters
            type: string
            default: "-vv"
        backend: bash
        run: pytest ${{ args.path }} ${{ args.params }}

      ci:
        help: Run the same fast checks used by CI
        hooks:
          pre-run:
            - task: curriculum.validate
            - task: curriculum.check-generated
            - task: notebooks.check
            - task: tests.unit
            - task: tests.linter

  package:
    tasks:
      build:
        help: Build and inspect the wheel and source distribution
        backend: bash
        run: |
          poetry build --clean
          python -m zipfile -l dist/*.whl | grep 'fcmath/__init__.py'

  release:
    vars:
      app: |
        env npm_config_ignore_scripts=true npx --yes \
        -p semantic-release \
        -p "@semantic-release/commit-analyzer" \
        -p "@semantic-release/release-notes-generator" \
        -p "@semantic-release/changelog" \
        -p "@semantic-release/exec" \
        -p "@semantic-release/github" \
        -p "@semantic-release/git" \
        -p "@google/semantic-release-replace-plugin" \
        semantic-release

    tasks:
      ci:
        help: Run semantic release on CI
        run: ${{ vars.app }} --ci

      dry:
        help: Run semantic release in dry-run mode
        run: ${{ vars.app }} --dry-run
