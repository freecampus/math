      "id": "diagnostic-algebra-equation",
      "type": "numeric",
      "prompt": "Solve $2(x-3)+4=10$ over the real numbers.",
      "answer": 6,
      "skill_mode": "manual-calculation",
      "outcome_id": "advanced-algebra-outcome-3",
      "validation": {
        "mode": "numeric",
        "absolute_tolerance": 0,
        "relative_tolerance": 0
      },
      "hint": "Expand first, then isolate the term containing $x$.",
      "explanation": "Distribute to get $2x-6+4=10$, combine to $2x-2=10$, add 2, and divide by 2. Substitution gives $2(3)+4=10$ after evaluating $x-3=3$, so $x=6$ is verified."
    },
    {
