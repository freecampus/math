      "answer": ["a", "b"],
      "skill_mode": "conceptual",
      "outcome_id": "advanced-algebra-outcome-1",
      "validation": {
        "mode": "set-equality"
      },
      "hint": "Check the radical and denominator separately.",
      "explanation": "The radicand requires $x-1\\ge0$, while the denominator excludes $x=3$. Thus the domain is $[1,3)\\cup(3,\\infty)$."
