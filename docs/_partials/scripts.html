<script>
  (() => {
    const stylesheet = [...document.styleSheets].find((sheet) =>
      sheet.href?.endsWith("/styles.css"),
    );
    const siteRoot = stylesheet
      ? new URL(".", stylesheet.href)
      : new URL("./", document.baseURI);
    for (const name of ["quiz-web.js", "learning-ui.js"]) {
      const script = document.createElement("script");
      script.src = new URL(`assets/${name}`, siteRoot);
      script.defer = true;
      document.body.append(script);
    }
  })();
</script>
