      "prompt": "From $ac=bc$, which condition makes cancellation of $c$ valid in a field?",
      "options": [
        { "id": "a", "text": "$a\\ne b$" },
        { "id": "b", "text": "$c\\ne0$" },
        { "id": "c", "text": "$c>0$" },
        { "id": "d", "text": "$a,b,c$ must be integers" }
