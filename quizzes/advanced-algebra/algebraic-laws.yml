      "answer": "b",
      "skill_mode": "conceptual",
      "outcome_id": "advanced-algebra-outcome-1",
      "validation": { "mode": "exact" },
      "hint": "Cancellation multiplies by the inverse of the common factor.",
      "explanation": "The inverse $c^{-1}$ exists exactly when $c\\ne0$. Positivity is stronger than necessary."
