      "answer": "b",
      "skill_mode": "mixed",
      "outcome_id": "advanced-algebra-outcome-1",
      "validation": { "mode": "exact" },
      "hint": "Factor the numerator, then retain the denominator restriction.",
      "explanation": "$r^3-s^3=(r-s)(r^2+rs+s^2)$, and cancellation is valid exactly when $r-s\\ne0$."
