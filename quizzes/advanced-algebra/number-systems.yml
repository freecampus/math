      "id": "number-systems-complex-order",
      "type": "single-choice",
      "prompt": "Why is there no usual ordered-field relation on $\\mathbb C$ extending the real order?",
      "options": [
        { "id": "a", "text": "Complex addition is not closed." },
        { "id": "b", "text": "Complex multiplication is not closed." },
        {
          "id": "c",
          "text": "Either $i$ or $-i$ would be positive, but its square is $-1$."
        },
        { "id": "d", "text": "Real numbers are not complex numbers." }
      ],
      "answer": "c",
      "skill_mode": "conceptual",
      "outcome_id": "advanced-algebra-outcome-8",
      "validation": { "mode": "exact" },
      "hint": "In an ordered field, the square of every nonzero element is positive.",
      "explanation": "A compatible linear order would force a square of $i$ or $-i$ to be positive, contradicting $i^2=(-i)^2=-1<0$."
    },
