        { "id": "c", "text": "The coefficients are integers." },
        { "id": "d", "text": "Radicals cannot satisfy polynomial equations." }
      ],
      "answer": "b",
      "skill_mode": "mixed",
      "outcome_id": "advanced-algebra-outcome-13",
      "validation": { "mode": "exact" },
      "hint": "List the sign choices involving $\\sqrt3$ and $\\sqrt2$.",
      "explanation": "The roots are $\\pm(\\sqrt3+\\sqrt2)$ and $\\pm(\\sqrt3-\\sqrt2)$. The interval $3<y<13/4$ selects the intended one."
