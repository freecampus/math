    {
      "id": "proof-methods-hypothesis-conclusion",
      "type": "single-choice",
      "prompt": "In the theorem 'if integer $n$ is divisible by $6$, then $n$ is even,' which statement is the hypothesis?",
      "options": [
        { "id": "a", "text": "$n$ is an integer" },
        { "id": "b", "text": "$6\\mid n$" },
        { "id": "c", "text": "$n$ is even" },
        { "id": "d", "text": "$2\\mid6$" }
      ],
      "answer": "b",
      "skill_mode": "conceptual",
      "outcome_id": "advanced-algebra-outcome-6",
      "validation": { "mode": "exact" },
      "hint": "The hypothesis follows the word 'if'; the integer universe is already declared.",
      "explanation": "$6\\mid n$ is assumed. The conclusion to derive is that $n$ is even."
    },
    {
      "id": "proof-methods-contrapositive",
      "type": "single-choice",
      "prompt": "What is the contrapositive of $P\\Rightarrow Q$?",
      "options": [
        { "id": "a", "text": "$Q\\Rightarrow P$" },
        { "id": "b", "text": "$\\neg P\\Rightarrow\\neg Q$" },
        { "id": "c", "text": "$\\neg Q\\Rightarrow\\neg P$" },
        { "id": "d", "text": "$P\\Rightarrow\\neg Q$" }
      ],
      "answer": "c",
      "skill_mode": "conceptual",
      "outcome_id": "advanced-algebra-outcome-8",
      "validation": { "mode": "exact" },
      "hint": "Negate both parts and reverse their order.",
      "explanation": "$P\\Rightarrow Q$ and $\\neg Q\\Rightarrow\\neg P$ are logically equivalent."
    },
    {
      "id": "proof-methods-valid-counterexample",
      "type": "single-choice",
      "prompt": "Which value refutes 'if real $x^2>9$, then $x>3$'?",
      "options": [
        { "id": "a", "text": "$x=0$" },
        { "id": "b", "text": "$x=2$" },
        { "id": "c", "text": "$x=4$" },
        { "id": "d", "text": "$x=-4$" }
      ],
      "answer": "d",
      "skill_mode": "symbolic-reasoning",
      "outcome_id": "advanced-algebra-outcome-8",
      "validation": { "mode": "exact" },
      "hint": "A counterexample must make the hypothesis true and the conclusion false.",
      "explanation": "$(-4)^2=16>9$, while $-4>3$ is false."
    },
    {
      "id": "proof-methods-exhaustive-cases",
      "type": "single-choice",
      "prompt": "Which cases exhaust every real parameter when both division and inequality direction may matter?",
      "options": [
        { "id": "a", "text": "$a>0$ and $a<0$" },
        { "id": "b", "text": "$a\\ge0$ and $a\\le0$" },
        { "id": "c", "text": "$a>0$, $a=0$, and $a<0$" },
        { "id": "d", "text": "$a=1$ and $a=-1$" }
      ],
      "answer": "c",
      "skill_mode": "conceptual",
      "outcome_id": "advanced-algebra-outcome-8",
      "validation": { "mode": "exact" },
      "hint": "The sign of a divisor has three distinct behaviors.",
      "explanation": "Trichotomy gives exactly the positive, zero, and negative cases."
    },
    {
      "id": "proof-methods-divisibility-witness",
      "type": "single-choice",
      "prompt": "To prove $a\\mid(b+c)$ from $a\\mid b$ and $a\\mid c$, which representation begins a direct proof?",
      "options": [
        { "id": "a", "text": "$a=bm=cn$" },
        { "id": "b", "text": "$b=am$ and $c=an$ for integers $m,n$" },
        { "id": "c", "text": "$b/a=c/a$" },
        { "id": "d", "text": "$b+c=a$" }
      ],
      "answer": "b",
      "skill_mode": "symbolic-reasoning",
      "outcome_id": "advanced-algebra-outcome-8",
      "validation": { "mode": "exact" },
      "hint": "Expand each divisibility hypothesis using its own integer witness.",
      "explanation": "$b+c=a(m+n)$ and $m+n$ is an integer, which is exactly the target definition."
    },
    {
      "id": "proof-methods-contradiction-opening",
      "type": "single-choice",
      "prompt": "To prove by contradiction that there is no greatest integer, what should be assumed?",
      "options": [
        { "id": "a", "text": "Every integer is greatest." },
        { "id": "b", "text": "There is a greatest integer $N$." },
        { "id": "c", "text": "$N+1$ is not an integer." },
        { "id": "d", "text": "The integers are finite." }
      ],
      "answer": "b",
      "skill_mode": "conceptual",
      "outcome_id": "advanced-algebra-outcome-8",
      "validation": { "mode": "exact" },
      "hint": "Assume the exact negation of the theorem.",
      "explanation": "From an alleged greatest integer $N$, the larger integer $N+1$ gives the contradiction."
    },
    {
