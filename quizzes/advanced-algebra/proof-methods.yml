      "prompt": "Which components are required to prove there exists exactly one object with property $P$?",
      "options": [
        { "id": "a", "text": "construct or establish at least one object" },
        { "id": "b", "text": "show any two such objects are equal" },
        { "id": "c", "text": "check one numerical example only" },
        { "id": "d", "text": "assume the object is unique" }
