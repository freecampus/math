      "answer": ["a", "b"],
      "skill_mode": "conceptual",
      "outcome_id": "advanced-algebra-outcome-8",
      "validation": { "mode": "set-equality" },
      "hint": "'Exactly one' combines at-least-one and at-most-one.",
