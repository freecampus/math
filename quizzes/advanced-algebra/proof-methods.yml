      "type": "single-choice",
      "prompt": "In ordinary induction beginning at $n=1$, what does the inductive step prove?",
      "options": [
        { "id": "a", "text": "$P(1)$ only" },
        { "id": "b", "text": "$P(k+1)\\Rightarrow P(k)$" },
        {
          "id": "c",
          "text": "for arbitrary $k\\ge1$, $P(k)\\Rightarrow P(k+1)$"
        },
        { "id": "d", "text": "$P(k)$ by assuming $P(k)$" }
