      "answer": ["a", "b"],
      "skill_mode": "conceptual",
      "outcome_id": "advanced-algebra-outcome-6",
      "validation": { "mode": "set-equality" },
      "hint": "An 'if and only if' contains a forward and reverse implication.",
      "explanation": "Both $P\\Rightarrow Q$ and $Q\\Rightarrow P$ are required."
    },
