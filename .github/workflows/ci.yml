name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VIRTUALENV_ACTIVATORS: "bash,python"

jobs:
  quality:
    name: Curriculum, lint, notebooks, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: fcmath
          auto-update-conda: true
          conda-solver: libmamba
          python-version: "3.10"
      - name: Cache Poetry and Quarto data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .cache/deno
          key: quality-${{ runner.os }}-${{ hashFiles('poetry.lock', 'docs/_quarto.yml') }}
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry check
          poetry install --extras "dev"
      - name: Validate generated curriculum and quizzes
        run: |
          makim curriculum.validate
          makim curriculum.check-generated
      - name: Check generated notebooks
        run: makim notebooks.check
      - name: Run repository linters
        run: makim tests.linter
      - name: Build documentation once
        run: makim docs.build
      - name: Execute representative notebooks
        if: github.event_name == 'pull_request'
        run: makim notebooks.execute-representative
      - name: Execute every notebook
        if: github.event_name != 'pull_request'
        run: makim notebooks.execute-all
      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: freecampus-math-site
          path: build

  package-tests:
    name: Package tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda/dev.yaml
          channels: conda-forge,nodefaults
          activate-environment: fcmath
          auto-update-conda: true
          conda-solver: libmamba
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: package-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry check
          poetry install --extras "dev"
      - name: Run unit and property tests
        run: makim tests.unit
      - name: Build distributions
        if: matrix.python-version == '3.10'
        run: makim package.build
