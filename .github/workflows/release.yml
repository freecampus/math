name: Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VIRTUALENV_ACTIVATORS: "bash,python"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda/release.yaml
          channels: conda-forge,nodefaults
          activate-environment: fcmath
          auto-update-conda: true
          conda-solver: libmamba
          python-version: "3.13"
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry check
          poetry install --extras "dev"
      - name: Verify release inputs
        run: |
          makim curriculum.validate
          makim curriculum.check-generated
          makim notebooks.check
          makim tests.unit
      - name: Semantic-release dry run
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: makim release.dry
      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: makim release.ci
      - name: Publish distributions to PyPI with trusted publishing
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
