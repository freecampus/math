name: Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VIRTUALENV_ACTIVATORS: "bash,python"

jobs:
  release:
    name: Verify and prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has-distributions: ${{ steps.distributions.outputs.available }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda/release.yaml
          channels: conda-forge,nodefaults
          activate-environment: fcmath
          auto-update-conda: true
          conda-solver: libmamba
          python-version: "3.13"
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry check
          poetry install --extras "dev"
      - name: Verify release inputs
        run: |
          makim curriculum.validate
          makim curriculum.check-generated
          makim notebooks.check
          makim tests.unit
      - name: Semantic-release dry run
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: makim release.dry
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: makim release.ci
      - name: Detect release distributions
        id: distributions
        if: github.event_name != 'pull_request'
        run: |
          if compgen -G "dist/*" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload distributions for trusted publishing
        if: steps.distributions.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/

  publish-pypi:
    name: Publish distributions to PyPI
    if: ${{ github.event_name != 'pull_request' && needs.release.outputs.has-distributions == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish distributions to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
